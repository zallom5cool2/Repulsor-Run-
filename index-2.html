<!DOCTYPE html>
<html lang="en">
<head>

<title>Repulsor Run</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0a1230;--panel:rgba(255,248,230,.9);--fg:#1b1b24;--gold:#ffb400;--red:#e0252b;--cyan:#7fe9ff}

:root[data-theme="dark"]{--panel:rgba(12,16,32,.82);--fg:#fff4d6}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:600 16px "Rajdhani","Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;color:#fff4d6;text-shadow:0 1px 6px #000}
#score{font-size:30px;font-weight:800;letter-spacing:.04em}

#kl{font-size:15px;letter-spacing:.12em;color:var(--cyan);margin-top:-2px}
#ring{--p:100;--c:#7fe9ff;width:66px;height:66px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.14) 0);display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(127,233,255,.5)}
#ring b{width:52px;height:52px;border-radius:50%;background:rgba(6,10,28,.88);display:flex;align-items:center;justify-content:center;font-size:21px}
#boss{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%);width:min(78vw,360px);display:none;text-align:center;color:#ff7a8a;font-size:14px;letter-spacing:.2em;text-shadow:0 1px 6px #000;pointer-events:none}
#bb{height:10px;margin-top:4px;border:2px solid #ff4a5a;border-radius:6px;overflow:hidden;background:rgba(0,0,0,.5)}
#bhp{height:100%;width:100%;background:linear-gradient(90deg,#ff2a55,#ffb400)}
#warn{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:26px;font-weight:800;letter-spacing:.18em;color:#ff4a5a;text-shadow:0 0 12px #ff2a55;display:none;pointer-events:none;animation:bl .4s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#warn{animation:none}}
#lock{position:fixed;left:0;top:0;width:60px;height:60px;display:none;pointer-events:none;border:2px solid rgba(255,74,90,.9);border-radius:50%;box-shadow:0 0 10px rgba(255,42,85,.6)}
#ld{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:13px;color:#ff9aa5;white-space:nowrap;text-shadow:0 1px 4px #000}
.ctl{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);touch-action:none}
#stick{left:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35)}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:rgba(127,233,255,.55);box-shadow:0 0 14px var(--cyan);pointer-events:none}
#fire{right:24px;width:96px;height:96px;border-radius:50%;border:3px solid var(--gold);background:radial-gradient(circle,#ffe58a,#e0252b);color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 3px #000}
@media (hover:hover) and (pointer:fine){.ctl{display:none}}
#ov{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,8,20,.45);padding:20px}
#card{background:var(--panel);color:var(--fg);border:2px solid var(--gold);border-radius:16px;padding:22px 24px;text-align:center;max-width:340px;backdrop-filter:blur(6px)}
#t{margin:0 0 6px;font-size:32px;letter-spacing:.06em}
#m{margin:6px 0 16px;font-weight:500;line-height:1.4}
#go{font:800 19px "Rajdhani",system-ui,sans-serif;padding:12px 30px;border:0;border-radius:12px;background:linear-gradient(180deg,#ffd45a,#e0952b);color:#2a1200;cursor:pointer}
#abil{right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 136px);display:grid;grid-template-columns:repeat(3,58px);gap:8px}
.ab{--r:0;width:58px;height:58px;border-radius:14px;border:2px solid var(--cyan);color:#fff;font:800 12px "Rajdhani",system-ui,sans-serif;background:linear-gradient(to top,rgba(0,0,0,.72) calc(var(--r)*100%),rgba(20,60,90,.55) 0);touch-action:none}
#suits{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 14px}
.sb{font:700 14px "Rajdhani",system-ui,sans-serif;padding:6px 10px;border-radius:9px;border:2px solid var(--gold);background:transparent;color:var(--fg);cursor:pointer}
.sb.on{background:var(--gold);color:#2a1200}
</style>
</head>
<body>
<div id="hud"><div><div id="score">0</div><div id="kl">KILLS 0</div></div><div id="ring"><b id="hpn">100</b></div></div>
<div id="boss"><span id="bn"></span><div id="bb"><div id="bhp"></div></div></div>

<div id="ov"><div id="card"><h1 id="t">REPULSOR RUN</h1><p id="m">Fly the city and blast the drones. Drag the left pad to steer, hold FIRE to shoot. Desktop: WASD, Space to fire, keys 1-5 for missiles, unibeam, shield, nano bomb and nanobot heal.</p><div id="suits"></div><button id="go">LAUNCH</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const SKY=0x0a1230,scene=new THREE.Scene();

scene.background=new THREE.CanvasTexture(sc);scene.fog=new THREE.Fog(0x3a1f5a,60,340);
const hc=document.createElement('canvas');hc.width=hc.height=64;const hx=hc.getContext('2d'),hg=hx.createRadialGradient(32,32,0,32,32,32);
hg.addColorStop(0,'rgba(255,255,255,1)');hg.addColorStop(.3,'rgba(255,255,255,.45)');hg.addColorStop(1,'rgba(255,255,255,0)');hx.fillStyle=hg;hx.fillRect(0,0,64,64);
const HT=new THREE.CanvasTexture(hc),hm=c=>new THREE.SpriteMaterial({map:HT,color:c,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}),SC=hm(0x7fe9ff),SO=hm(0xff7a30),SR=hm(0xff2a55);
const CAPS=[0x7fe9ff,0xff3fa4,0xffb400].map(c=>new THREE.MeshBasicMaterial({color:c}));
const sa=new Float32Array(1200);for(let i=0;i<1200;i+=3){sa[i]=(Math.random()-.5)*900;sa[i+1]=40+Math.random()*300;sa[i+2]=(Math.random()-.5)*900}

  es.add(new THREE.Mesh(new THREE.SphereGeometry(50,24,16),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),side:THREE.BackSide})));

// Hero: red and gold armor from primitives

const hero=new THREE.Group(),body=new THREE.Group();hero.add(body);scene.add(hero);
const P=hero.position;P.set(0,18,0);
const part=(w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);body.add(o)};
part(1.1,1.4,.6,RED,0,0,0);part(.7,.5,.64,GOLD,0,.15,0);part(.62,.62,.62,GOLD,0,1.1,0);
const hands=[],flames=[];
[-1,1].forEach(s=>{
  part(.3,1.2,.3,RED,s*.75,.8,0);part(.34,.36,.34,GOLD,s*.75,1.55,0);
  const h=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),glowM);h.position.set(s*.75,1.85,0);body.add(h);hands.push(h);const hh=new THREE.Sprite(SC);hh.scale.setScalar(1.6);h.add(hh);

  const f=new THREE.Mesh(new THREE.ConeGeometry(.2,1.2,8),fireM);f.rotation.x=Math.PI;f.position.set(s*.28,-2.8,0);body.add(f);flames.push(f);const fh=new THREE.Sprite(SO);fh.scale.setScalar(2.6);fh.position.set(s*.28,-2.9,0);body.add(fh);
});

 {n:'MARK I',a:0x8a8f98,b:0x4b4f58,g:0xcfe8ff,hp:140,st:.8,rate:.22,d:1},
 {n:'MARK 42',a:0xb3121a,b:0xe8a82a,g:0x9ff3ff,hp:100,st:1.15,rate:.14,d:1},
 {n:'MARK III',a:0x9e0f14,b:0xf2b52a,g:0xbff6ff,hp:110,st:1,rate:.17,d:1.5},
 {n:'COBALT',a:0x1f4fd8,b:0xc9d6ff,g:0x7fe9ff,hp:90,st:1.3,rate:.15,d:1.2},
 {n:'MARK 85',a:0x7a0c14,b:0xd9a21f,g:0x6ff0ff,hp:130,st:1.1,rate:.12,d:1.5,nano:1}];
let SU=SUITS[0];
const ball=(r,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),m);o.position.set(x,y,z);body.add(o)};
const NB=140,nbP=new Float32Array(NB*3),nbA=Array.from({length:NB},()=>({a:Math.random()*6.28,y:Math.random()*5-2.5,r:1.2+Math.random()*1.6,s:2+Math.random()*3})),nbG=new THREE.BufferGeometry();
nbG.setAttribute('position',new THREE.BufferAttribute(nbP,3));
const nanos=new THREE.Points(nbG,new THREE.PointsMaterial({color:0x7dffb0,size:5,sizeAttenuation:false,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));
nanos.visible=false;nanos.frustumCulled=false;hero.add(nanos);

const sph=(r,m,x,y,z,sx,sy,sz)=>{const o=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),m);o.position.set(x,y,z);o.scale.set(sx||1,sy||1,sz||1);body.add(o);return o};
function buildSuit(i){
  SU=SUITS[i];while(body.children.length)body.remove(body.children[0]);hands.length=flames.length=0;
  const A=M(SU.a,.7,i===0?.5:.2),B=M(SU.b,.8,.18),D=M(0x1d2028,.7,.45),G=new THREE.MeshBasicMaterial({color:SU.g});

  const ad=new THREE.Mesh(new THREE.CircleGeometry(.17,16),G);ad.position.set(0,.5,-.55);ad.rotation.y=Math.PI;body.add(ad);
  [-.6,-.85,-1.1].forEach(y=>part(.78,.2,.55,D,0,y,0));part(1,.4,.7,B,0,-1.35,0);
  cyl(.2,.2,.3,D,0,.95,0);sph(.4,A,0,1.3,0,1,1.1,1.05);part(.5,.55,.1,B,0,1.28,-.36);
  part(.16,.05,.05,G,-.12,1.35,-.42);part(.16,.05,.05,G,.12,1.35,-.42);
  part(.8,1,.38,D,0,.1,.56);part(.5,.07,.1,G,0,.45,.76);part(.5,.07,.1,G,0,.2,.76);
  [-1,1].forEach(s=>{
    sph(.5,A,s*.95,.72,0,1,.8,1);cyl(.17,.15,.8,A,s*1.05,1.15,0);sph(.19,D,s*1.05,1.57,0);
    cyl(.16,.2,.8,A,s*1.05,2,0);cyl(.23,.2,.4,B,s*1.05,2.35,0);cyl(.19,.19,.06,G,s*1.05,2.58,0);
    const h=new THREE.Mesh(new THREE.SphereGeometry(.2,10,8),glowM);h.position.set(s*1.05,2.65,0);body.add(h);hands.push(h);
    const hh=new THREE.Sprite(SC);hh.scale.setScalar(1.6);h.add(hh);
    cyl(.25,.2,.9,A,s*.3,-2,0);sph(.21,D,s*.3,-2.5,0);cyl(.2,.16,.95,A,s*.3,-3,0);part(.4,.55,.6,B,s*.3,-3.7,.05);cyl(.14,.18,.1,G,s*.3,-4.02,0);
    const f=new THREE.Mesh(new THREE.ConeGeometry(.2,1.2,8),fireM);f.rotation.x=Math.PI;f.position.set(s*.3,-4.65,0);body.add(f);flames.push(f);

  const A=M(SU.a,.85,.25),B=M(SU.b,.9,.2),G=new THREE.MeshBasicMaterial({color:SU.g});

    const fh=new THREE.Sprite(SO);fh.scale.setScalar(2.6);fh.position.set(s*.3,-2.95,0);body.add(fh);
    if(i===1||i===3)part(.08,1.3,.8,B,s*1.0,.1,.3);

buildSuit(0);
const beam=new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.3,300,12,1,true),new THREE.MeshBasicMaterial({color:0xbff6ff,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false}));

// City
const tc=document.createElement('canvas');tc.width=tc.height=64;const g=tc.getContext('2d');
g.fillStyle='#121a36';g.fillRect(0,0,64,64);
for(let y=0;y<8;y++)for(let x=0;x<8;x++)if(Math.random()<.4){g.fillStyle=Math.random()<.7?'#ffd479':'#7fe9ff';g.fillRect(x*8+2,y*8+2,4,4)}
const tex=new THREE.CanvasTexture(tc);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
const BM=new THREE.MeshStandardMaterial({map:tex,emissiveMap:tex,emissive:0xffffff,emissiveIntensity:.9,roughness:.9});
const bl=[],ROWS=22,GAP=22;
for(let i=0;i<ROWS;i++)for(const s of[-1,1]){
  const w=10+Math.random()*12,h=25+Math.random()*100,geo=new THREE.BoxGeometry(w,h,GAP-3),uv=geo.attributes.uv;

// Game state
let state='menu',score=0,kills=0,hp=100,dist=0,spd=45,cd=0,shake=0,firing=false,vx=0,vy=0,spawnT=0,best=0,sx=0,sy=0;
try{best=+localStorage.getItem('rr_best')||0}catch(e){}
const bolts=[],foes=[],fx=[],keys={},_v=new THREE.Vector3();
let boss=null,nextBoss=10,bossLv=0,shT=0,bm=0,healT=0;const eb=[],rg=$('ring'),lk=$('lock'),cds=[0,0,0,0,0],CDM=[5,8,9,12,20],ab=document.querySelectorAll('.ab'),_w=new THREE.Vector3();

function use(i){
  if(state!=='play'||cds[i]>0)return;cds[i]=CDM[i];
  if(i===0){const pool=boss?foes.concat(boss.m):foes.slice();
    hands.forEach((h,k)=>{for(let j=0;j<3;j++){const p=new THREE.Vector3();h.getWorldPosition(p);const b=new THREE.Mesh(bG,glowM);b.scale.set(1.4,1.4,5);b.position.copy(p);

    for(let j=foes.length-1;j>=0;j--)if(foes[j].position.distanceTo(P)<110){boom(foes[j].position,0xffb04a,1.2);scene.remove(foes[j]);foes.splice(j,1);kills++}
    eb.forEach(b=>scene.remove(b));eb.length=0;if(boss){boss.hp-=20;if(boss.hp<=0)killBoss()}}
}
const dG=new THREE.IcosahedronGeometry(1.4,0),dM=M(0x2b3150,.9,.3,0x240040),eG=new THREE.SphereGeometry(.5,8,6),
